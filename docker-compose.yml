services:
  edge:
    build:
      context: ./edge
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - maintenance_flags:/etc/nginx/flags
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        DEPENDENCY_CACHE_VERSION: ${DEPENDENCY_CACHE_VERSION:-2026-09-19-1}
    restart: unless-stopped
    expose:
      - "8080"

volumes:
  maintenance_flags:
