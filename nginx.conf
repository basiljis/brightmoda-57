worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;

  # DNS-резолвер нужен, чтобы nginx не кешировал IP Supabase навсегда
  resolver 8.8.8.8 1.1.1.1 ipv6=off valid=300s;
  resolver_timeout 10s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Разрешённые источники для CORS
  map $http_origin $cors_origin {
    default "";
    "~*^https?://(localhost(:[0-9]+)?|(www\.)?shoplet\.pro|([a-z0-9-]+)\.shoplet\.pro|.*\.lovable\.(app|dev))$" $http_origin;
  }

  # ---------- SPA ----------
  server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok";
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico|mp4)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }

  # ---------- Reverse-proxy на Supabase (обход блокировок в РФ) ----------
  server {
    listen 8080;
    server_name api.shoplet.pro;

    client_max_body_size 50m;

    set $supabase_upstream "kpimhnlvjndbvwlozeow.supabase.co";

    location / {
      # Preflight отвечаем сразу
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin      "$cors_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "authorization, apikey, content-type, x-client-info, x-supabase-api-version, range, prefer, accept-profile, content-profile, x-requested-with" always;
        add_header Access-Control-Max-Age           "86400" always;
        add_header Content-Length 0;
        return 204;
      }

      proxy_pass https://$supabase_upstream$request_uri;

      proxy_ssl_server_name on;
      proxy_ssl_name        $supabase_upstream;
      proxy_set_header Host $supabase_upstream;

      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Real-IP        $remote_addr;
      proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # Supabase отдаёт свои CORS-заголовки — убираем дубли
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_hide_header Access-Control-Max-Age;

      add_header Access-Control-Allow-Origin      "$cors_origin" always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers     "authorization, apikey, content-type, x-client-info, x-supabase-api-version, range, prefer, accept-profile, content-profile, x-requested-with" always;
      add_header Access-Control-Expose-Headers    "content-range, content-length, x-supabase-api-version" always;
      add_header Cache-Control "no-store" always;

      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
