worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Docker DNS — переживает пересоздание контейнера app
  resolver 127.0.0.11 ipv6=off valid=10s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream app_upstream {
    server app:8080 max_fails=2 fail_timeout=5s;
    keepalive 32;
  }

  server {
    listen 8080 default_server;
    server_name _;

    location = /__edge_health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok";
    }

    location = /maintenance.html {
      root /usr/share/nginx/maintenance;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      internal;
    }

    location / {
      # Ручное включение заглушки: touch /etc/nginx/flags/maintenance.enabled
      if (-f /etc/nginx/flags/maintenance.enabled) {
        return 503;
      }

      proxy_pass http://app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      client_max_body_size 50m;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_connect_timeout 3s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_intercept_errors on;

      error_page 502 503 504 = @maintenance;
    }

    location @maintenance {
      root /usr/share/nginx/maintenance;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header Retry-After 900 always;
      try_files /maintenance.html =503;
    }
  }
}
